name: Validate, update and publish Powerball dashboard

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * *"

concurrency:
  group: powerball-site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      update_failed: ${{ steps.update.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch and validate official results
        id: update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npm run update-data
      - name: Validate the saved dataset and run tests
        run: |
          npm run validate
          npm test
      - name: Commit verified data or failure status
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
        run: |
          git add db.js data-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Powerball results and synchronization status"
            git push origin HEAD:master
          fi
      - name: Prepare the static website
        run: npm run build
      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

  report-update-failure:
    needs: validate
    if: needs.validate.outputs.update_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the failed synchronization for Actions notifications
        run: |
          echo "::error::Official results could not be updated. The previous validated dataset has been retained; see data-status.json and the update step."
          exit 1
